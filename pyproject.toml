[project]
name = "callofchaos"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Yavanni", email = "thenuclearnexus@gmail.com" }
]
dependencies = [
    "bolt>=0.20.1",
    "bolt_expressions>=0.12.2",
    "allay>=1.3.0",
    "pillow>=10.1.0",
]
readme = "README.md"
requires-python = ">= 3.11"

[project.scripts]
hello = "callofchaos:hello"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/callofchaos"]
